
replicaCount: 3

image:
  pullPolicy: IfNotPresent

rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 2

resources:
  requests:
    cpu: 200m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 256Mi

config:
  APP_ENV: production

secrets:
  existingSecret: "go-ci-demo-prod-secrets"

terminationGracePeriodSeconds: 30
