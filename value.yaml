
replicaCount: 3

image:
  repository: "123456789012.dkr.ecr.eu-west-1.amazonaws.com/go-ci-demo"
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

containerPort: 8080

rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0

probes:
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 20

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

config:
  APP_ENV: development

secrets:
  # Create this Secret separately; do not commit its values.
  existingSecret: ""

terminationGracePeriodSeconds: 30
